# ~/.config/starship.toml  ·  Aurora prompt
# generated by matugen from ~/.config/matugen/templates/starship.toml — edit that file instead
# Pills: ( folder ) ( git ) ( changes ) ( language )        took 1.2s · 09:50
#        ❯

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "aurora"

format = """
$directory\\
$git_branch\\
$git_status\\
$golang\\
$nodejs\\
$python\\
$rust\\
$java\\
$c\\
$docker_context\\
$line_break\\
$character"""

right_format = "$cmd_duration$status$time"

[palettes.aurora]
bg      = "{{colors.surface_container_lowest.default.hex}}"
surface = "{{colors.surface_container_high.default.hex}}"
text    = "{{colors.on_surface.default.hex}}"
muted   = "{{colors.on_surface_variant.default.hex}}"
teal    = "{{colors.primary.default.hex}}"
sky     = "{{colors.secondary.default.hex}}"
violet  = "{{colors.tertiary.default.hex}}"
pink    = "#f9a8d4"
yellow  = "#f5d58a"
red     = "{{colors.error.default.hex}}"

[directory]
style = "fg:bg bg:teal bold"
format = "[](fg:teal)[ $path]($style)[$read_only]($read_only_style)[ ]($style)[](fg:teal) "
read_only = " 󰌾"
read_only_style = "fg:bg bg:teal"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"code"      = " "

[git_branch]
symbol = " "
style = "fg:bg bg:violet"
format = "[](fg:violet)[ $symbol$branch ]($style)[](fg:violet) "

[git_status]
style = "fg:bg bg:pink"
format = "([](fg:pink)[ $all_status$ahead_behind ]($style)[](fg:pink) )"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
modified = "*"
untracked = "?"
staged = "+"
deleted = "-"

[golang]
symbol = " "
style = "fg:sky bg:surface"
format = "[](fg:surface)[ $symbol($version) ]($style)[](fg:surface) "

[nodejs]
symbol = " "
style = "fg:teal bg:surface"
format = "[](fg:surface)[ $symbol($version) ]($style)[](fg:surface) "

[python]
symbol = " "
style = "fg:yellow bg:surface"
format = "[](fg:surface)[ $symbol($version)( \\\\($virtualenv\\\\)) ]($style)[](fg:surface) "

[rust]
symbol = " "
style = "fg:red bg:surface"
format = "[](fg:surface)[ $symbol($version) ]($style)[](fg:surface) "

[java]
symbol = " "
style = "fg:red bg:surface"
format = "[](fg:surface)[ $symbol($version) ]($style)[](fg:surface) "

[c]
symbol = " "
style = "fg:sky bg:surface"
format = "[](fg:surface)[ $symbol($version) ]($style)[](fg:surface) "

[docker_context]
symbol = " "
style = "fg:sky bg:surface"
format = "[](fg:surface)[ $symbol$context ]($style)[](fg:surface) "

[character]
success_symbol = "[❯](bold fg:teal)"
error_symbol   = "[❯](bold fg:red)"
vimcmd_symbol  = "[❮](bold fg:violet)"

[cmd_duration]
min_time = 1000
style = "fg:muted"
format = "[took $duration ]($style)"

[status]
disabled = false
style = "fg:red"
format = "[✘ $status ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = "[· $time]($style)"
