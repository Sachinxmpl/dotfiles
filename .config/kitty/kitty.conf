# ~/.config/kitty/kitty.conf  ·  Aurora theme
# Reload in a running kitty with  Ctrl+Shift+F5

# ---- font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ---- window ----
window_padding_width 14
background_opacity   0.88
confirm_os_window_close 0
enable_audio_bell no
cursor_shape     beam
cursor_blink_interval 0.6
scrollback_lines 10000

# ---- splits & tabs ----
enabled_layouts  splits, stack
window_border_width 1pt
active_border_color   #6ee7c8
inactive_border_color #1b2235
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  round
tab_bar_min_tabs     2
tab_title_template   " {index} · {title} "

# ---- Aurora colors ----
foreground            #e6edf7
background            #0a0e18
selection_foreground  #05080f
selection_background  #6ee7c8
cursor                #6ee7c8
cursor_text_color     #05080f
url_color             #7cc4ff

active_tab_foreground   #05080f
active_tab_background   #6ee7c8
inactive_tab_foreground #9aa6bb
inactive_tab_background #111827
tab_bar_background      #05080f

# black
color0  #1b2235
color8  #5b6780
# red
color1  #ff7a90
color9  #ff9bab
# green (aurora teal)
color2  #6ee7c8
color10 #9ff2dc
# yellow
color3  #f5d58a
color11 #f9e3ae
# blue
color4  #7cc4ff
color12 #a6d6ff
# magenta
color5  #a78bfa
color13 #c4b1fc
# cyan
color6  #67e8f9
color14 #9cf0fb
# white
color7  #c9d3e3
color15 #e6edf7

# ---- wallpaper colours ----
# matugen writes colors.conf when you change wallpaper (aurora-wall); it overrides
# the Aurora colours above. Delete it to go back to them.
include colors.conf

# ---- keys ----
map ctrl+shift+enter  launch --location=vsplit --cwd=current
map ctrl+shift+minus  launch --location=hsplit --cwd=current
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+left   neighboring_window left
map ctrl+shift+right  neighboring_window right
map ctrl+shift+up     neighboring_window up
map ctrl+shift+down   neighboring_window down
map ctrl+shift+z      toggle_layout stack
