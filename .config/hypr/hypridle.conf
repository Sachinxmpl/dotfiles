# ~/.config/hypr/hypridle.conf  ·  what happens when you leave the laptop alone
#   2.5 min  dim the screen
#   5 min    lock (Aurora lock screen)
#   5.5 min  turn the screen off
#   15 min   sleep (only on battery)
# Watching a video in a browser/mpv blocks all of this automatically.

general {
    lock_cmd = pidof hyprlock || hyprlock                  # one lock screen at a time
    before_sleep_cmd = loginctl lock-session                # lock before suspending
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# dim (and restore on activity)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

# sleep, but only when unplugged
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -1)" = "0" ] && systemctl suspend
}
