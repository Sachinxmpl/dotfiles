# ~/.config/hypr/hyprlock.conf  ·  "Terminal session" lock screen
# Lock: Super+L   ·   clear typed password: Esc / Ctrl+U
# Notes: "##" means a literal "#" (a single "#" starts a comment).
#        position = x, y  → for top-left items, x moves right and a negative y moves down.

$mono   = JetBrainsMono Nerd Font
$dim    = rgb(4d5562)
$text   = rgb(c9d1d9)
$bright = rgb(e6edf3)
$x      = 144            # left edge of the text column

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = out, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, out
    animation = fadeOut, 1, 2, out
    animation = inputFieldDots, 1, 1, out
}

background {
    monitor =
    path = ~/.config/hypr/lock-bg.png     # near-black with a faint teal glow
    color = rgb(07090c)
}

# ---------------------------------------------------------------- boot-style header
label {
    monitor =
    text = cmd[] echo "Arch Linux $(uname -r) (tty1)"
    color = $dim
    font_size = 18
    font_family = $mono
    position = $x, -225
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[] echo "Session locked: $(LC_TIME=C date +'%a %b %d %H:%M') on :0"
    color = $dim
    font_size = 18
    font_family = $mono
    position = $x, -262
    halign = left
    valign = top
}

# ---------------------------------------------------------------- clock + date
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $bright
    font_size = 92
    font_family = $mono
    position = 138, -318
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date +'%A, %d %B' | tr '[:upper:]' '[:lower:]') — session locked"
    color = rgb(8b949e)
    font_size = 18
    font_family = $mono
    position = $x, -452
    halign = left
    valign = top
}

# ---------------------------------------------------------------- login prompt
label {
    monitor =
    text = cmd[] echo "<span foreground='##6ee7c8'>$(cat /etc/hostname)</span> <span foreground='##4d5562'>login:</span> $USER"
    color = $text
    font_size = 18
    font_family = $mono
    position = $x, -545
    halign = left
    valign = top
}

label {
    monitor =
    text = password:
    color = $dim
    font_size = 18
    font_family = $mono
    position = $x, -592
    halign = left
    valign = top
}

# the password itself: an invisible box placed right after "password:"
# (if the dots don't line up on your screen, nudge the first number of `position`)
input-field {
    monitor =
    size = 420, 72
    position = 300, -568
    halign = left
    valign = top

    outline_thickness = 0
    rounding = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)

    font_color = $text
    font_family = $mono
    dots_size = 0.15
    dots_spacing = 0.55
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false

    # a teal block cursor while empty (the invisible padding after it keeps it on the left)
    placeholder_text = <span foreground='##6ee7c8'>█</span>                                
    check_text = <span foreground='##8b949e'>authenticating…</span>                  
    fail_text = <span foreground='##ff7a90'>Login incorrect ($ATTEMPTS)</span>        
}

# ---------------------------------------------------------------- status, bottom-right
label {
    monitor =
    text = cmd[update:5000] bash -c 'b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); n=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep "^yes" | cut -d: -f2); echo "<span foreground=\"##4d5562\">bat</span> ${b:-?}%   <span foreground=\"##4d5562\">net</span> ${n:-offline}"'
    color = $text
    font_size = 13
    font_family = $mono
    position = -144, 110
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] bash -c 't=$(playerctl metadata --format "{{title}}" 2>/dev/null | cut -c1-40); [ -n "$t" ] && echo "<span foreground=\"##4d5562\">playing</span> $t" || echo ""'
    color = $text
    font_size = 13
    font_family = $mono
    position = -144, 80
    halign = right
    valign = bottom
}
